<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태양계 3D 시뮬레이션</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000005;
    overflow: hidden;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
  #canvas-container.dragging { cursor: grabbing; }

  #title {
    position: fixed;
    top: 18px; left: 24px;
    color: #eaeaf5;
    z-index: 10;
    pointer-events: none;
  }
  #title h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #f0f0ff;
    text-shadow: 0 0 12px rgba(120,150,255,0.5);
  }
  #title p {
    margin-top: 4px;
    font-size: 12px;
    color: #8a8ab0;
  }

  #panel {
    position: fixed;
    bottom: 18px; left: 24px;
    z-index: 10;
    background: rgba(15,15,30,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 16px;
    color: #dcdcf2;
    min-width: 220px;
  }
  #panel .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  #panel .row:last-child { margin-bottom: 0; }
  #panel input[type="range"] {
    width: 120px;
    accent-color: #6c8cff;
  }
  #panel button {
    background: rgba(108,140,255,0.15);
    border: 1px solid rgba(108,140,255,0.4);
    color: #cdd6ff;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #panel button:hover { background: rgba(108,140,255,0.3); }

  #planet-list {
    position: fixed;
    top: 18px; right: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: rgba(15,15,30,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px;
  }
  #planet-list button {
    background: transparent;
    border: none;
    color: #b8b8d8;
    text-align: left;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, color 0.15s;
  }
  #planet-list button:hover { background: rgba(255,255,255,0.08); color: #fff; }
  #planet-list .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #info-box {
    position: fixed;
    bottom: 18px; right: 24px;
    z-index: 10;
    background: rgba(15,15,30,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 18px;
    color: #eaeaf5;
    max-width: 260px;
    display: none;
  }
  #info-box.visible { display: block; }
  #info-box h2 { font-size: 15px; margin-bottom: 6px; color: #fff; }
  #info-box p { font-size: 11.5px; color: #a8a8c8; line-height: 1.5; margin: 2px 0; }
  #info-box .close-btn {
    position: absolute; top: 8px; right: 10px;
    cursor: pointer; color: #888; font-size: 14px;
  }

  #loading, #error-box {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000005;
    display: flex; align-items: center; justify-content: center;
    color: #8a8ab0;
    font-size: 13px;
    z-index: 100;
    transition: opacity 0.5s;
    text-align: center;
    padding: 20px;
  }
  #error-box { display: none; flex-direction: column; gap: 10px; color: #f0a0a0; }
</style>
</head>
<body>

<div id="loading">태양계를 불러오는 중...</div>
<div id="error-box">
  <div style="font-size:16px;">⚠ 3D 라이브러리를 불러오지 못했어요</div>
  <div style="font-size:12px; color:#c8a0a0;">인터넷 연결을 확인하거나 페이지를 새로고침 해보세요.</div>
</div>

<div id="canvas-container"></div>

<div id="title">
  <h1>☉ 태양계 시뮬레이션</h1>
  <p>드래그: 회전 · 스크롤: 확대/축소 · 행성 클릭: 정보 보기</p>
</div>

<div id="planet-list"></div>

<div id="panel">
  <div class="row">
    <span>공전 속도</span>
    <input type="range" id="speed-slider" min="0" max="5" step="0.05" value="1">
  </div>
  <div class="row">
    <span id="pause-label">재생 중</span>
    <button id="pause-btn">일시정지</button>
  </div>
  <div class="row">
    <span>궤도선 표시</span>
    <button id="orbit-toggle-btn">끄기</button>
  </div>
  <div class="row">
    <button id="reset-btn" style="width:100%; text-align:center;">카메라 초기화</button>
  </div>
</div>

<div id="info-box">
  <span class="close-btn" id="info-close">✕</span>
  <h2 id="info-name">-</h2>
  <p id="info-desc">-</p>
  <p id="info-period">-</p>
  <p id="info-diameter">-</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  // ---------- SAFETY CHECK: did three.js load? ----------
  if (typeof THREE === 'undefined') {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = 'flex';
    return;
  }

  try {

  // ---------- SCENE SETUP ----------
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // ---------- CUSTOM CAMERA CONTROLS (no external addon needed) ----------
  const camTarget = new THREE.Vector3(0, 0, 0);
  let camDistance = 141;
  let camTheta = 0;              // horizontal angle
  let camPhi = 0.4;              // vertical angle
  const DEFAULT_DIST = 141, DEFAULT_THETA = 0, DEFAULT_PHI = 0.4;

  function updateCameraPosition() {
    const x = camTarget.x + camDistance * Math.cos(camPhi) * Math.sin(camTheta);
    const y = camTarget.y + camDistance * Math.sin(camPhi);
    const z = camTarget.z + camDistance * Math.cos(camPhi) * Math.cos(camTheta);
    camera.position.set(x, y, z);
    camera.lookAt(camTarget);
  }
  updateCameraPosition();

  let isDragging = false;
  let dragMoved = false;
  let lastX = 0, lastY = 0;

  function onPointerDown(x, y) {
    isDragging = true;
    dragMoved = false;
    lastX = x; lastY = y;
    container.classList.add('dragging');
  }
  function onPointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - lastX;
    const dy = y - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    camTheta -= dx * 0.006;
    camPhi += dy * 0.006;
    camPhi = Math.max(-1.4, Math.min(1.4, camPhi));
    lastX = x; lastY = y;
    updateCameraPosition();
  }
  function onPointerUp() {
    isDragging = false;
    container.classList.remove('dragging');
  }

  renderer.domElement.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onPointerUp);

  renderer.domElement.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  renderer.domElement.addEventListener('touchend', onPointerUp);

  renderer.domElement.addEventListener('wheel', (e) => {
    e.preventDefault();
    camDistance *= (1 + e.deltaY * 0.001);
    camDistance = Math.max(8, Math.min(600, camDistance));
    updateCameraPosition();
  }, { passive: false });

  // ---------- STARFIELD ----------
  function createStarfield() {
    const starGeo = new THREE.BufferGeometry();
    const starCount = 6000;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 800 + Math.random() * 1200;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.cos(phi);
      positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, sizeAttenuation: true });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
  }
  createStarfield();

  // ---------- LIGHTING ----------
  const ambient = new THREE.AmbientLight(0x222233, 1.2);
  scene.add(ambient);

  const sunLight = new THREE.PointLight(0xffffff, 2.2, 0, 0);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);

  // ---------- TEXTURE HELPERS (procedural, no external images) ----------
  function makeSphereTexture(baseColor, options) {
    options = options || {};
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, size, size);

    const bandCount = options.bands || 0;
    if (bandCount > 0) {
      for (let i = 0; i < bandCount; i++) {
        const y = (i / bandCount) * size;
        ctx.fillStyle = options.bandColors[i % options.bandColors.length];
        ctx.globalAlpha = 0.35;
        ctx.fillRect(0, y, size, size / bandCount * (0.6 + Math.random()*0.5));
      }
      ctx.globalAlpha = 1;
    }

    const speckles = options.speckles || 0;
    for (let i = 0; i < speckles; i++) {
      ctx.fillStyle = options.speckleColor || 'rgba(0,0,0,0.15)';
      const x = Math.random() * size;
      const y = Math.random() * size;
      const r = Math.random() * (options.speckleSize || 6) + 1;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    return new THREE.CanvasTexture(canvas);
  }

  function makeSunTexture() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(size/2, size/2, size*0.05, size/2, size/2, size*0.55);
    grad.addColorStop(0, '#fff7d6');
    grad.addColorStop(0.4, '#ffd54a');
    grad.addColorStop(0.75, '#ff9d1f');
    grad.addColorStop(1, '#ff6a00');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = 'rgba(255,180,60,0.25)';
      const x = Math.random() * size;
      const y = Math.random() * size;
      const r = Math.random() * 14 + 3;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    return new THREE.CanvasTexture(canvas);
  }

  function makeRingTexture(innerColor, outerColor) {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, size, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.15, innerColor);
    grad.addColorStop(0.55, outerColor);
    grad.addColorStop(0.75, innerColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, 1);
    return new THREE.CanvasTexture(canvas);
  }

  // ---------- SUN ----------
  const SUN_RADIUS = 8;
  const sunGeo = new THREE.SphereGeometry(SUN_RADIUS, 48, 48);
  const sunMat = new THREE.MeshBasicMaterial({ map: makeSunTexture() });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sun);

  function makeGlowTexture() {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, 'rgba(255,220,140,0.9)');
    grad.addColorStop(0.25, 'rgba(255,180,80,0.35)');
    grad.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
  }
  const glowMat = new THREE.SpriteMaterial({ map: makeGlowTexture(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const glowSprite = new THREE.Sprite(glowMat);
  glowSprite.scale.set(SUN_RADIUS * 7, SUN_RADIUS * 7, 1);
  sun.add(glowSprite);

  // ---------- PLANET DATA ----------
  const planetData = [
    {
      name: '수성', color: '#9c9c94',
      radius: 0.9, distance: 14, speed: 4.15, rotSpeed: 0.004,
      desc: '태양에서 가장 가까운 행성으로, 대기가 거의 없어 낮과 밤의 온도차가 매우 큽니다.',
      period: '공전 주기: 88일', diameter: '지름: 약 4,879 km',
      texOpts: { bands: 0, speckles: 120, speckleColor: 'rgba(60,60,55,0.3)', speckleSize: 4 }
    },
    {
      name: '금성', color: '#e0c07a',
      radius: 1.5, distance: 20, speed: 1.62, rotSpeed: 0.002,
      desc: '두꺼운 이산화탄소 대기로 뒤덮여 있으며, 태양계에서 가장 뜨거운 표면 온도를 가집니다.',
      period: '공전 주기: 225일', diameter: '지름: 약 12,104 km',
      texOpts: { bands: 4, bandColors: ['#e8cf8f','#d9b869','#f0dca0','#c9a85a'], speckles: 0 }
    },
    {
      name: '지구', color: '#2e6bb8',
      radius: 1.6, distance: 27, speed: 1.0, rotSpeed: 0.02,
      desc: '생명체가 존재하는 것으로 알려진 유일한 행성으로, 표면의 71%가 물로 덮여 있습니다.',
      period: '공전 주기: 365일', diameter: '지름: 약 12,742 km',
      texOpts: { bands: 3, bandColors: ['#2e6bb8','#3f8f4f','#4a7fc9'], speckles: 60, speckleColor: 'rgba(255,255,255,0.5)', speckleSize: 8 },
      hasMoon: true
    },
    {
      name: '화성', color: '#b1502f',
      radius: 1.1, distance: 34, speed: 0.53, rotSpeed: 0.018,
      desc: '붉은 행성으로 불리며, 산화철로 뒤덮인 표면과 태양계에서 가장 큰 화산인 올림푸스 몬스가 있습니다.',
      period: '공전 주기: 687일', diameter: '지름: 약 6,779 km',
      texOpts: { bands: 0, speckles: 100, speckleColor: 'rgba(90,40,20,0.35)', speckleSize: 5 }
    },
    {
      name: '목성', color: '#c9a077',
      radius: 4.2, distance: 48, speed: 0.084, rotSpeed: 0.04,
      desc: '태양계에서 가장 큰 행성으로, 유명한 대적점이라는 거대한 폭풍이 있습니다.',
      period: '공전 주기: 12년', diameter: '지름: 약 139,820 km',
      texOpts: { bands: 8, bandColors: ['#d9b78f','#c9986a','#e8cba0','#b5825a'], speckles: 0 }
    },
    {
      name: '토성', color: '#e0c88a',
      radius: 3.6, distance: 63, speed: 0.034, rotSpeed: 0.038,
      desc: '아름다운 얼음과 암석으로 이루어진 고리로 유명하며, 밀도가 낮아 물에 뜰 수 있습니다.',
      period: '공전 주기: 29년', diameter: '지름: 약 116,460 km',
      texOpts: { bands: 6, bandColors: ['#e8d5a0','#d9c088','#f0e0b0'], speckles: 0 },
      hasRing: true, ringInner: 4.6, ringOuter: 8.2, ringColorA: 'rgba(220,195,150,0.7)', ringColorB: 'rgba(190,160,110,0.5)'
    },
    {
      name: '천왕성', color: '#9fd3d9',
      radius: 2.4, distance: 76, speed: 0.012, rotSpeed: 0.025,
      desc: '자전축이 거의 90도로 기울어져 옆으로 누운 채 자전하는 독특한 행성입니다.',
      period: '공전 주기: 84년', diameter: '지름: 약 50,724 km',
      texOpts: { bands: 2, bandColors: ['#9fd3d9','#b0dee0'], speckles: 0 },
      hasRing: true, ringInner: 2.9, ringOuter: 4.2, ringColorA: 'rgba(160,210,215,0.4)', ringColorB: 'rgba(140,190,200,0.25)'
    },
    {
      name: '해왕성', color: '#3a5fd9',
      radius: 2.3, distance: 88, speed: 0.006, rotSpeed: 0.024,
      desc: '태양에서 가장 먼 행성으로, 태양계에서 가장 강한 바람이 불어 초속 2,100km에 이릅니다.',
      period: '공전 주기: 165년', diameter: '지름: 약 49,244 km',
      texOpts: { bands: 3, bandColors: ['#3a5fd9','#4a72e0','#2c4fc0'], speckles: 0 }
    }
  ];

  const planetColors = {
    '수성': '#9c9c94', '금성': '#e0c07a', '지구': '#2e6bb8', '화성': '#b1502f',
    '목성': '#c9a077', '토성': '#e0c88a', '천왕성': '#9fd3d9', '해왕성': '#3a5fd9'
  };

  // ---------- BUILD PLANETS ----------
  const planetGroup = new THREE.Group();
  scene.add(planetGroup);

  const planets = [];
  const orbitLines = [];

  planetData.forEach((data) => {
    const orbitGroup = new THREE.Object3D();
    orbitGroup.rotation.y = Math.random() * Math.PI * 2;
    planetGroup.add(orbitGroup);

    const geo = new THREE.SphereGeometry(data.radius, 32, 32);
    const tex = makeSphereTexture(data.color, data.texOpts);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.05 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.x = data.distance;
    mesh.userData = { name: data.name, desc: data.desc, period: data.period, diameter: data.diameter, color: data.color };
    orbitGroup.add(mesh);

    if (data.name === '천왕성') mesh.rotation.z = Math.PI / 2.2;

    if (data.hasRing) {
      const ringGeo = new THREE.RingGeometry(data.ringInner, data.ringOuter, 64);
      const ringTex = makeRingTexture(data.ringColorA, data.ringColorB);
      const ringMat = new THREE.MeshBasicMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2 - (data.name === '천왕성' ? 1.4 : 0.45);
      mesh.add(ring);
    }

    let moon = null;
    if (data.hasMoon) {
      const moonGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const moonTex = makeSphereTexture('#bbbbbb', { speckles: 40, speckleColor: 'rgba(80,80,80,0.4)', speckleSize: 3 });
      const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.9 });
      moon = new THREE.Mesh(moonGeo, moonMat);
      moon.position.x = data.radius + 2.2;
      const moonPivot = new THREE.Object3D();
      moonPivot.add(moon);
      mesh.add(moonPivot);
      moon.userData.pivot = moonPivot;
    }

    const orbitPoints = [];
    const segments = 128;
    for (let i = 0; i <= segments; i++) {
      const theta = (i / segments) * Math.PI * 2;
      orbitPoints.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
    }
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
    const orbitMat = new THREE.LineBasicMaterial({ color: 0x445577, transparent: true, opacity: 0.35 });
    const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
    scene.add(orbitLine);
    orbitLines.push(orbitLine);

    planets.push({
      mesh, orbitGroup, moon,
      speed: data.speed, distance: data.distance, rotSpeed: data.rotSpeed,
      angle: Math.random() * Math.PI * 2,
      data
    });
  });

  // ---------- ASTEROID BELT ----------
  function createAsteroidBelt() {
    const count = 1200;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 39 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * 1.2;
      positions[i*3] = Math.cos(theta) * r;
      positions[i*3+1] = y;
      positions[i*3+2] = Math.sin(theta) * r;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0x998877, size: 0.28 });
    const belt = new THREE.Points(geo, mat);
    scene.add(belt);
  }
  createAsteroidBelt();

  // ---------- UI: PLANET LIST ----------
  const listEl = document.getElementById('planet-list');
  const sunInfo = { name: '태양', desc: '태양계 중심의 항성으로, 태양계 질량의 99.8%를 차지하며 스스로 빛을 냅니다.', period: '자전 주기: 약 27일', diameter: '지름: 약 1,392,700 km' };

  const sunBtn = document.createElement('button');
  sunBtn.innerHTML = '<span class="dot" style="background:#ffcc55;"></span>태양';
  sunBtn.onclick = () => focusOn(sun, SUN_RADIUS * 4, sunInfo);
  listEl.appendChild(sunBtn);

  planets.forEach((p) => {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="dot" style="background:${planetColors[p.data.name]};"></span>${p.data.name}`;
    btn.onclick = () => focusOn(p.mesh, p.data.radius * 6 + 4, p.mesh.userData);
    listEl.appendChild(btn);
  });

  // ---------- INFO BOX ----------
  const infoBox = document.getElementById('info-box');
  const infoName = document.getElementById('info-name');
  const infoDesc = document.getElementById('info-desc');
  const infoPeriod = document.getElementById('info-period');
  const infoDiameter = document.getElementById('info-diameter');
  document.getElementById('info-close').onclick = () => infoBox.classList.remove('visible');

  function showInfo(userData) {
    infoName.textContent = userData.name;
    infoDesc.textContent = userData.desc;
    infoPeriod.textContent = userData.period;
    infoDiameter.textContent = userData.diameter;
    infoBox.classList.add('visible');
  }

  // ---------- CAMERA FOCUS ----------
  let focusTarget = null;
  let focusOffset = 10;

  function focusOn(mesh, offset, userData) {
    focusTarget = mesh;
    focusOffset = offset;
    if (userData) showInfo(userData);
  }

  document.getElementById('reset-btn').onclick = () => {
    focusTarget = null;
    focusOffset = null;
    resetting = true;
  };
  let resetting = false;

  // ---------- RAYCASTING (click on planets) ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('click', (event) => {
    if (dragMoved) return; // ignore clicks that were actually drags
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const meshes = [sun, ...planets.map(p => p.mesh)];
    const intersects = raycaster.intersectObjects(meshes);
    if (intersects.length > 0) {
      const obj = intersects[0].object;
      if (obj === sun) {
        focusOn(sun, SUN_RADIUS * 4, sunInfo);
      } else {
        const p = planets.find(pl => pl.mesh === obj);
        if (p) focusOn(obj, p.data.radius * 6 + 4, obj.userData);
      }
    }
  });

  // ---------- CONTROLS PANEL ----------
  let speedMultiplier = 1;
  let paused = false;
  let orbitsVisible = true;

  document.getElementById('speed-slider').addEventListener('input', (e) => {
    speedMultiplier = parseFloat(e.target.value);
  });

  const pauseBtn = document.getElementById('pause-btn');
  const pauseLabel = document.getElementById('pause-label');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '재생' : '일시정지';
    pauseLabel.textContent = paused ? '일시정지됨' : '재생 중';
  });

  const orbitToggleBtn = document.getElementById('orbit-toggle-btn');
  orbitToggleBtn.addEventListener('click', () => {
    orbitsVisible = !orbitsVisible;
    orbitLines.forEach(l => l.visible = orbitsVisible);
    orbitToggleBtn.textContent = orbitsVisible ? '끄기' : '켜기';
  });

  // ---------- RESIZE ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- ANIMATION LOOP ----------
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);

    if (!paused) {
      const dt = delta * speedMultiplier;

      sun.rotation.y += dt * 0.05;

      planets.forEach((p) => {
        p.angle += dt * p.speed * 0.3;
        p.orbitGroup.rotation.y = p.angle;
        p.mesh.rotation.y += dt * p.rotSpeed * 10;
        if (p.moon && p.moon.userData.pivot) {
          p.moon.userData.pivot.rotation.y += dt * 2;
        }
      });
    }

    if (focusTarget) {
      const worldPos = new THREE.Vector3();
      focusTarget.getWorldPosition(worldPos);
      camTarget.lerp(worldPos, 0.08);
      camDistance += (focusOffset - camDistance) * 0.08;
      updateCameraPosition();
    } else if (resetting) {
      camTarget.lerp(new THREE.Vector3(0, 0, 0), 0.08);
      camDistance += (DEFAULT_DIST - camDistance) * 0.08;
      camTheta += (DEFAULT_THETA - camTheta) * 0.08;
      camPhi += (DEFAULT_PHI - camPhi) * 0.08;
      updateCameraPosition();
      if (Math.abs(camDistance - DEFAULT_DIST) < 0.1) resetting = false;
    }

    renderer.render(scene, camera);
  }

  // ---------- START ----------
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 500);
  animate();

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    const eb = document.getElementById('error-box');
    eb.style.display = 'flex';
    eb.innerHTML = '<div style="font-size:16px;">⚠ 오류가 발생했어요</div><div style="font-size:12px; color:#c8a0a0;">' + (err && err.message ? err.message : String(err)) + '</div>';
    console.error(err);
  }

})();
</script>
</body>
</html>
